<style>
/* Layout: 교정지 책상 — 위에 책 고르는 띠, 아래로 표지 · 내용 · 열람(펼침면 + 메모) · 검수 메모 */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --sunk: #e8eaee;
  --ink: #1b2233;
  --muted: #5d6576;

  --ok: #2c7d55;         /* 확인 완료 */
  --note: #8a6a12;       /* 메모 */
  --age: #e9533f;
  --age-text: var(--age);
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --shadow: 0 1px 2px rgb(20 26 40 / 0.06), 0 8px 24px rgb(20 26 40 / 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1b202b; --sunk: #232938; --ink: #e7e9ef; --muted: #a2a9b8; --line: #323a4c;
    --proof: #ff7a6e; --ok: #5cc38e; --note: #e0bd57;
    --age-text: color-mix(in oklab, var(--age) 55%, white);
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1b202b; --sunk: #232938; --ink: #e7e9ef; --muted: #a2a9b8; --line: #323a4c;
  --proof: #ff7a6e; --ok: #5cc38e; --note: #e0bd57;
  --age-text: color-mix(in oklab, var(--age) 55%, white);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}
body[data-book="vlow"]   { --age: #e9533f; }
body[data-book="vhigh"]  { --age: #2a7fc9; }
body[data-book="vteen"]  { --age: #1e9a82; }
body[data-book="vyoung"] { --age: #2c4a7a; }
.vi { font-family: "Be Vietnam Pro", var(--body); }
/* 베트남어 화면: 성조 부호가 있는 글꼴로 */
:root[lang="vi"] { --display: "Be Vietnam Pro", "IBM Plex Sans KR", sans-serif; --body: "Be Vietnam Pro", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif; }
:root[lang="vi"] h2, :root[lang="vi"] .gate h1, :root[lang="vi"] .cmp-top .meta b { font-weight: 700; letter-spacing: -0.01em; }
:root[lang="vi"] .brand b, :root[lang="vi"] .gate .logo { font-weight: 800; letter-spacing: 0.02em; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); flex: none; }
.lang button { border: 0; background: none; padding: 3px 10px; cursor: pointer; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.ko-gloss { display: block; font-size: 12px; font-weight: 400; color: var(--muted); font-family: var(--body); }
table.terms td.memo details summary { cursor: pointer; font-size: 12.5px; }
table.terms td.memo details p { margin-top: 4px; font-size: 12.5px; }
.ko-sub { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }
.ko-sub::before { content: attr(data-tag) " "; font-size: 10.5px; font-weight: 700; padding: 0 4px; margin-right: 4px; border-radius: 3px; border: 1px solid var(--line); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 400 26px/1.2 var(--display); letter-spacing: 0.01em; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--age-text); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font: 400 20px/1 var(--display); letter-spacing: 0.04em; }
.brand b i { font-style: normal; color: #e98a2c; }
.brand b i + i { color: #7fb6d9; }
.brand span { color: var(--muted); font-size: 13px; }
.books { display: flex; gap: 6px; flex-wrap: wrap; }
.books button { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; }
.books button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.books button[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }

.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 14px; }

main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px; padding-block: 28px 80px; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; scroll-margin-top: 110px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.head .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--age-text); text-transform: uppercase; }
.head p { color: var(--muted); }

/* overview */
.ov { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ov button { text-align: left; display: grid; gap: 8px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.ov button[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.ov .t { display: flex; align-items: center; gap: 8px; font-weight: 700; }

.ov dt { color: var(--muted); }
.ov dd { margin: 0; font-family: var(--mono); font-size: 12.5px; }
.meter { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; display: flex; }
.meter b { background: var(--ok); }
.meter s { background: var(--proof); }
.ov .m { font-size: 12.5px; color: var(--muted); }

/* cover */
.cover { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.cover figure { margin: 0; display: grid; gap: 8px; }
.cover .img { position: relative; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); background: var(--sunk); }
.cover .img img { display: block; width: 100%; height: auto; }
.cover .img .spine { position: absolute; top: 0; bottom: 0; border-inline: 1px dashed rgb(255 255 255 / 0.7); pointer-events: none; }
.cover figcaption { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
.notes-list { display: grid; gap: 18px; }
.notes-list div { display: grid; gap: 4px; }
.notes-list h3 { display: flex; align-items: center; gap: 8px; }
.notes-list p { color: var(--ink); font-size: 14.5px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: color-mix(in oklab, var(--note) 18%, transparent); color: var(--note); }
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.specs div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.specs span { font-size: 12px; color: var(--muted); }
.specs b { font-family: var(--mono); font-weight: 500; font-size: 14px; }

/* contents */
.pagebar { display: flex; height: 44px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.pagebar div { display: grid; place-items: center; font-size: 12.5px; font-weight: 500; min-width: 0; overflow: hidden; white-space: nowrap; }
.pagebar .fm { background: var(--sunk); color: var(--muted); }
.pagebar .days { flex: 1; background: repeating-linear-gradient(90deg, color-mix(in oklab, var(--age) 22%, var(--surface)) 0 calc(100% / 61 - 1px), var(--surface) calc(100% / 61 - 1px) calc(100% / 61)); color: var(--ink); }
.pagebar-legend { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: -12px; }
.anatomy { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.anatomy article { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 12px; align-content: start; }
.anatomy h3 { display: flex; justify-content: space-between; align-items: baseline; }

.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

.extras b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); }

/* viewer */
/* 펼침은 내용 폭 전체, 검수 칸은 그 아래. 그림 높이는 화면 안에 들어오게(위 띠 + 펼침 머리 + 확인 띠를 뺀 만큼) */
.viewer { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.stage { scroll-margin-top: calc(var(--barh, 60px) + 8px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; }
.stage-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.stage-top .meta { display: grid; min-width: 0; margin-right: auto; }
.stage-top .meta b { font-size: 16px; }
.stage-top .meta span { color: var(--muted); font-size: 13px; }
.stage-top select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); max-width: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover { background: var(--sunk); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: color-mix(in oklab, var(--ink) 85%, var(--bg)); }
.scroller { overflow: auto; background: var(--sunk); position: relative; }
.scroller img { display: block; width: auto; height: auto; max-width: 100%; max-height: max(320px, calc(100vh - var(--barh, 60px) - 150px)); max-height: max(320px, calc(100svh - var(--barh, 60px) - 150px)); margin: 0 auto; background: #fff; cursor: zoom-in; }
.scroller.zoom { max-height: calc(100svh - var(--barh, 60px) - 150px); }
.scroller.zoom img { width: 200%; max-width: none; max-height: none; cursor: zoom-out; }
/* 그림 바로 아래 확인 띠 */
.qbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; border-top: 1px solid var(--line); }
.qhelp { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 0; overflow: hidden; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.panel header { grid-column: 1 / -1; }
.panel form.add { border-top: 0; border-left: 1px solid var(--line); align-self: stretch; align-content: start; }
/* 한 번 눌러 확인 */
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-width: 0; }
.confirm .hint { font-size: 12.5px; }
.btn.ok { min-height: 42px; padding: 0 20px; background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 700; font-size: 15.5px; }
.btn.ok:hover { background: color-mix(in oklab, var(--ok) 86%, var(--ink)); }
.done { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 42px; padding: 6px 12px; border-radius: 8px; background: color-mix(in oklab, var(--ok) 14%, var(--surface)); color: var(--ok); font-weight: 700; }
.done span { min-width: 0; overflow-wrap: anywhere; }
.confirm .others { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.linkbtn { border: 0; background: none; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.linkbtn:hover { color: var(--ink); }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
.me b { color: var(--ink); font-weight: 700; max-width: 12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 이름 입력 화면 */
.gate { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; overflow: auto; }
.gate form { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 14px; }
.gate .logo { font: 400 18px/1 var(--display); letter-spacing: 0.04em; }
.gate .logo i { font-style: normal; color: #e98a2c; } .gate .logo i + i { color: #7fb6d9; }
.gate h1 { font: 400 26px/1.25 var(--display); }
.gate p { color: var(--muted); font-size: 14px; }
.gate label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
.gate input { padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.gate .btn { min-height: 46px; font-size: 16px; }
.gate .err { color: var(--proof); font-size: 13px; min-height: 1.4em; }
.gate .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
body.gated, body.locked { overflow: hidden; }
@media (hover: none) { .kbd-hint { display: none; } }
/* 4권 같이 보기 */
.cmp { position: fixed; inset: 0; z-index: 80; background: var(--bg); overflow: auto; overscroll-behavior: contain; }
.cmp:focus { outline: none; }
.cmp-top { position: sticky; top: 0; z-index: 1; background: color-mix(in oklab, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.cmp-top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; }
.cmp-top .meta { display: grid; min-width: 0; margin-right: auto; }
.cmp-top .meta b { font: 400 20px/1.2 var(--display); letter-spacing: 0.01em; }
.cmp-top .meta span { color: var(--muted); font-size: 13px; }
.cmp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-block: 16px 40px; }
.cmp-card { display: grid; gap: 0; align-content: start; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; min-width: 0; }
.cmp-card[aria-current="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.cmp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.cmp-head .bk { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
.cmp-head .bk i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.cmp-head .tt { color: var(--muted); font-size: 13px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp-st { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: var(--st); background: color-mix(in oklab, var(--st) 14%, transparent); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-st.todo { --st: var(--muted); }
.cmp-open { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.cmp-open:hover img { outline: 2px solid var(--c); outline-offset: -2px; }
.cmp-card img { display: block; width: 100%; height: auto; background: #fff; }
/* 그림 아래 얇은 조작 띠 */
.cmp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 10px; border-top: 1px solid var(--line); }
.cmp-bar .btn { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
.cmp-bar .btn.ok { min-height: 34px; padding: 0 14px; font-size: 14px; }
.cmp-bar .done { min-height: 34px; padding: 2px 10px; font-size: 13.5px; gap: 10px; }
.cmp-bar .btn[aria-expanded="true"] { background: var(--sunk); }
.cmp-bar .open { margin-left: auto; }
.cmp-more { display: grid; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: color-mix(in oklab, var(--sunk) 45%, var(--surface)); }
.cmp-more .note { background: var(--surface); }
.cmp-more form { display: grid; gap: 8px; }
.cmp-more textarea { resize: vertical; min-height: 60px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.cmp-more .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
@media (max-width: 760px) { .cmp-grid { grid-template-columns: minmax(0, 1fr); } }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--shadow); }
.panel header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel header span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.thread { overflow: auto; padding: 10px 14px; display: grid; gap: 10px; align-content: start; min-height: 80px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
.note { display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border-left: 3px solid var(--st); }
.note .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.note .who b { color: var(--st); font-weight: 700; }
.note p { font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0; text-decoration: underline; }
.st-ok { --st: var(--ok); } .st-fix { --st: var(--proof); } .st-memo { --st: var(--note); }
form.add { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { text-align: center; padding: 6px 4px; font-size: 13px; cursor: pointer; border-left: 1px solid var(--line); }
.seg label:first-child { border-left: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: color-mix(in oklab, var(--st) 16%, var(--surface)); color: var(--st); font-weight: 700; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--age-text); outline-offset: -2px; }
form.add input[type=text] { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }

  applyLang();
  renderBooks(); renderCover(); renderContents(); renderJump(); show(idx); renderThumbs(); renderReview(); renderTerms(); renderMe();
  if ($('g-err').textContent) $('g-err').textContent = t('gateErr');
  syncBar();
}

// 탭: #terms(용어 검수표) / 나머지(인쇄 검수)
function route() {
  const terms = location.hash === '#terms' || location.hash.startsWith('#term-');
  $('m-print').hidden = terms; $('m-terms').hidden = !terms;
  $('books').hidden = terms; $('secnav').hidden = terms;
  $('tab-print').setAttribute('aria-current', terms ? 'false' : 'page');
  $('tab-terms').setAttribute('aria-current', terms ? 'page' : 'false');
  syncBar();
}
addEventListener('hashchange', route);

applyLang();
setBook(book);
route();
loadTerms();

if (VIEW_ONLY) {
  // claude.ai 안이거나 시트 주소가 아직 없으면: 열람만, 기록은 공개 주소에서
  $('p-form').hidden = true;
  OFFLINE = () => el('p', { class: 'signin' }, t('offline'), el('a', { href: PUBLIC_URL, target: '_blank', rel: 'noopener', text: t('offlineLink') }));
  renderThread(); renderConfirm(); renderThumbs(); renderReview(); renderTerms();
} else {
  renderMe();
  if (!myName) openGate();
  load();
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
}
</script>
